#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.
#
# ---------------------------------------------------------------------------
# RELEASE PIPELINE GATES (issue-499)
# A path-filter gate skips expensive work when only docs/site/tests change.
#
# binary-affected — true when ANY path that changes the compiled binary or
# release configuration changed:
#   src/*, Cargo.toml, Cargo.lock, build.rs, crew/*, commands/*, toolbox/*,
#   docs/COST.md, steering/*, dist-workspace.toml
#
# Test scenarios:
#   site/index.html only     → binary-affected=false → skip build, e2e, publish
#   docs/BRAND.md only       → binary-affected=false → skip build, e2e, publish
#   crew/architect.md only   → binary-affected=true  → build + publish
#   src/main.rs only         → binary-affected=true  → build + publish
#   Empty diff               → binary-affected=false → skip build, e2e, publish
#   First push / force-push  → binary-affected=true  → fail-open, full pipeline
#
# NOTE: Any new include_str! references in Rust source that resolve outside
# the above list must be added to the case statement in the `resolve` step.
# ---------------------------------------------------------------------------

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push to "main"
on:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

# don't let multiple instances of this run at the same time on the release branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.resolve.outputs.tag }}
      tag-flag: ${{ steps.resolve.outputs.tag-flag }}
      publishing: ${{ steps.resolve.outputs.publishing }}
      binary-affected: ${{ steps.resolve.outputs.binary-affected }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      # Resolve the release context. A PR only plans. A tag push publishes
      # that tag. A push to main derives v<version> from Cargo.toml and
      # publishes only when that release does not exist yet — auto-release on
      # version bump, no-op otherwise.
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/resolve-release.sh
      - name: Install dist
        env:
          DIST_VERSION: "0.32.0"
          DIST_TARGET: "x86_64-unknown-linux-gnu"
        run: bash .github/scripts/install-dist-verified.sh
      - name: Cache dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          PUBLISHING: ${{ steps.resolve.outputs.publishing }}
        run: bash .github/scripts/dist-plan.sh
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') && needs.plan.outputs.binary-affected == 'true' }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: bash .github/scripts/enable-windows-longpaths.sh
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: bash .github/scripts/install-rust-noninteractive.sh
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ join(matrix.targets, '-') }}
          cache-provider: ${{ matrix.cache_provider }}
      # Matrix-supplied and shell-specific (sh on Unix, pwsh on Windows). It comes
      # from cargo-dist's plan output, not this repo, so it stays inline — a bash
      # script here would be unrunnable on the windows-msvc runner.
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      # Same contract as `Install dist` above: matrix-supplied, shell-specific.
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: bash .github/scripts/build-dist-artifacts.sh
      - id: cargo-dist
        name: Post-build
        run: bash .github/scripts/post-build-dist.sh
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    if: ${{ needs.plan.outputs.binary-affected == 'true' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: bash .github/scripts/build-global-dist.sh
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Gates prod releases on the CLI e2e suite — a regression in install/doctor/
  # uninstall must not ship. Runs only when a release is about to publish.
  e2e-cli:
    needs:
      - plan
    if: ${{ needs.plan.outputs.publishing == 'true' && needs.plan.outputs.binary-affected == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Build
        run: cargo build --bin shipmates
      - name: Run CLI e2e suite
        run: bash tools/e2e_cli.sh

  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - e2e-cli
    # Only run if we're "publishing", and only if plan, local, global and e2e didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.plan.outputs.binary-affected == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') && (needs.e2e-cli.result == 'skipped' || needs.e2e-cli.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: bash .github/scripts/host-release.sh
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: bash .github/scripts/cleanup-artifacts.sh
      - name: Create GitHub Release
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
        run: bash .github/scripts/create-gh-release.sh

  publish-homebrew-formula:
    needs:
      - plan
      - host
      - e2e-cli
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    if: ${{ needs.plan.outputs.binary-affected == 'true' && (!fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          repository: "saman-mb/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # So we have access to the formula
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # This is extra complex because you can make your Formula name not match your app name
      # so we need to find releases with a *.rb file, and publish with that filename.
      - name: Commit formula files
        run: bash .github/scripts/commit-homebrew-formula.sh

  custom-publish-cargo:
    needs:
      - plan
      - host
      - e2e-cli
    if: ${{ needs.plan.outputs.binary-affected == 'true' && (!fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases) }}
    uses: ./.github/workflows/publish-cargo.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit
    # publish jobs get escalated permissions
    permissions:
      "id-token": "write"
      "packages": "write"

  announce:
    needs:
      - plan
      - host
      - e2e-cli
      - publish-homebrew-formula
      - custom-publish-cargo
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-homebrew-formula.result == 'skipped' || needs.publish-homebrew-formula.result == 'success') && (needs.custom-publish-cargo.result == 'skipped' || needs.custom-publish-cargo.result == 'success') }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
