name: Pages

# Build-validate the static site on every PR and push; deploy it to GitHub
# Pages only on pushes to main. Deploy needs the repo's Pages source set to
# "GitHub Actions" (Settings → Pages) — a one-time manual enablement.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gates the sources (skills/) and the site built from them, in that order:
  # a bad SKILL.md is reported against the file someone edited, not against a
  # derived page.
  # The job name is the status-check name branch protection matches on; leave it.
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skills
        run: python3 tools/validate_skills.py
      - name: Check skill names don't collide with harness built-ins (#105)
        run: python3 tools/validate_skill_names.py --check
      - name: Check generated command pages are up to date
        run: python3 tools/gen_command_pages.py --check
      - name: Check harness payloads are up to date
        run: python3 tools/build_harness_payloads.py --check
      # Gates the golden reference AND the generated agents/ + skills/ mirrors.
      # Without the mirror comparison, an edit to the tree the layout docs point
      # at passes every check and ships nothing.
      - name: Check canonical Claude export
        run: python3 tools/export.py check --target claude-code
      - name: Validate static site
        run: python3 .github/scripts/validate_site.py
      - name: Check for design-system drift (#131)
        run: python3 .github/scripts/validate_design_drift.py
      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v
      - name: Test installer source resolution
        run: bash tests/test_resolve_src.sh
      - name: Test harness install paths
        run: bash tests/test_install_harness.sh
      - name: Check install.sh is executable (#100)
        run: |
          mode=$(git ls-files -s install.sh | awk '{print $1}')
          if [ "$mode" != "100755" ]; then
            echo "install.sh mode is $mode, expected 100755"
            echo "Fix: git update-index --chmod=+x install.sh && git commit"
            exit 1
          fi

  # install.sh compiles the payload with whatever python3 the user's machine
  # has, so the floor is a supported configuration, not a footnote. The main job
  # pins "3.x" (newest), which is exactly why a 3.10-only call slipped through
  # once: it is invisible there and fatal on stock macOS.
  exporter-floor:
    name: Exporter on the minimum Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Build and check the Claude export
        run: |
          python3 tools/export.py check --target claude-code
          python3 tools/export.py build --target claude-code --out "$RUNNER_TEMP/floor"
          diff -r "$RUNNER_TEMP/floor/harnesses/claude-code" tests/golden/claude-code
      - name: Install end to end
        run: |
          bash install.sh --dir "$RUNNER_TEMP/install"
          test -f "$RUNNER_TEMP/install/skills/ship-issue/SKILL.md"

  deploy:
    name: Deploy to GitHub Pages
    needs: [validate, exporter-floor]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
