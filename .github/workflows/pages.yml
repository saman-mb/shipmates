name: Pages

# Build-validate the static site on every PR and push; deploy it to GitHub
# Pages only on pushes to main. Deploy needs the repo's Pages source set to
# "GitHub Actions" (Settings → Pages) — a one-time manual enablement.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gates the sources (skills/) and the site built from them, in that order:
  # a bad SKILL.md is reported against the file someone edited, not against a
  # derived page.
  # The job name is the status-check name branch protection matches on; leave it.
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Validate skills
        run: python3 tools/validate_skills.py
      - name: Check skill names don't collide with harness built-ins (#105)
        run: python3 tools/validate_skill_names.py --check
      - name: Check generated command pages are up to date
        run: python3 tools/gen_command_pages.py --check
      # Gates every target payload against its reference digest
      - name: Check target payload digests
        run: bash .github/scripts/check-payload-digests.sh
      - name: Run opencode golden and embedded install-fidelity tests
        run: bash .github/scripts/check-opencode-tests.sh
      # Codex has a native TOML crew plus shared Agent Skills. This checks the
      # golden payload and installed layout only; it never invokes Codex.
      - name: Check Codex golden payload and layout-install smoke
        run: bash tests/test_codex_smoke.sh
      # Config-only (no network): each harness_watch entry's declared tree must
      # agree with its adapter skill path. The live docs-drift check
      # (python3 tools/harness_watch.py) is a manual dev command — see
      # .claude/commands/harness-watch.md — not a CI gate, to avoid red builds
      # when an upstream docs site is momentarily down.
      - name: Check harness-watch config is self-consistent (offline)
        run: python3 tools/harness_watch.py --offline
      - name: Run the skill-lint regression suite
        run: bash tests/test_validate_skills.sh
      # actionlint shellchecks inline `run:` blocks; a script extracted to
      # .github/scripts/ is outside its reach, so this is that gate.
      - name: Lint the extracted workflow scripts
        run: bash .github/scripts/lint-shell.sh
      - name: Install deps for the demo GIF check (Pillow + DejaVu Sans Mono)
        # Both are pinned: the artifacts are compared as pixels, and the pixels
        # come from Pillow's bundled freetype and this exact font version. An
        # unpinned bump would re-render every glyph and red-build an unrelated
        # PR. Bump these deliberately, regenerating the artifacts in the same
        # commit.
        run: bash .github/scripts/install-demo-deps.sh
      - name: Check demo GIF/poster artifacts are up to date
        run: python3 tools/gen_demo_gif.py --check
      - name: Check install (CLI) demo GIF/poster artifacts are up to date
        run: python3 tools/gen_cli_demo_gif.py --check
      # Verifies each reel's stage count against its SKILL.md too (needs cargo,
      # which this job already has), so an upstream stage change red-builds here.
      - name: Check per-command demo GIF/poster artifacts are up to date
        run: python3 tools/gen_command_demos.py --check
      - name: Validate ruleset required checks
        run: python3 .github/scripts/validate_ruleset_checks.py
      - name: Validate static site
        run: python3 .github/scripts/validate_site.py
      - name: Check for design-system drift (#131)
        run: python3 .github/scripts/validate_design_drift.py
      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v
      - name: Run the Rust test suite
        run: cargo test --all-targets
      - name: Test installer source resolution
        run: bash tests/test_resolve_src.sh
      - name: Check install.sh is executable (#100)
        run: bash .github/scripts/check-install-perms.sh

  exporter-floor:
    name: Exporter on minimum environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build and check every target payload
        run: bash .github/scripts/build-check-all-targets.sh
      - name: Install end to end
        run: bash .github/scripts/install-claude-e2e.sh
      - name: Install every harness at once (--harness all)
        run: bash .github/scripts/install-all-harnesses-e2e.sh
      # Tools ship by default; --with-tools selects subsets or opts out.
      - name: Install tools end to end (--with-tools)
        run: bash .github/scripts/install-tools-e2e.sh
      - name: Install the opencode harness end to end
        run: bash .github/scripts/install-opencode-e2e.sh
      - name: Install the antigravity harness end to end
        run: bash .github/scripts/install-antigravity-e2e.sh
      # Codex agents are TOML and Copilot needs the .agent.md double extension.
      # Both are easy to regress into a plain <name>.md that installs cleanly
      # and is silently never loaded, so assert the format, not just presence.
      - name: Install the crew-bearing non-Claude harnesses end to end
        run: bash .github/scripts/install-crew-harnesses-e2e.sh

      # cursor: agents directory reported but frontmatter schema unverified.
      # windsurf: target identity under review since the Devin Desktop rename.
      - name: Install a skill-only harness end to end
        run: bash .github/scripts/install-skill-only-harness-e2e.sh

  deploy:
    name: Deploy to GitHub Pages
    needs: [validate, exporter-floor]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
