name: Pages

# Build-validate the static site on every PR and push; deploy it to GitHub
# Pages only on pushes to main. Deploy needs the repo's Pages source set to
# "GitHub Actions" (Settings → Pages) — a one-time manual enablement.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gates the sources (skills/) and the site built from them, in that order:
  # a bad SKILL.md is reported against the file someone edited, not against a
  # derived page.
  # The job name is the status-check name branch protection matches on; leave it.
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skills
        run: python3 tools/validate_skills.py
      - name: Check skill names don't collide with harness built-ins (#105)
        run: python3 tools/validate_skill_names.py --check
      - name: Check generated command pages are up to date
        run: python3 tools/gen_command_pages.py --check
      # Gates every target payload against its reference digest
      - name: Check target payload digests
        run: |
          for target in claude-code opencode gemini codex cursor github-copilot windsurf zed; do
            cargo run -- check --target "$target"
          done
      - name: Run the skill-lint regression suite
        run: bash tests/test_validate_skills.sh
      - name: Install deps for the demo GIF check (Pillow + DejaVu Sans Mono)
        # Both are pinned: the artifacts are compared as pixels, and the pixels
        # come from Pillow's bundled freetype and this exact font version. An
        # unpinned bump would re-render every glyph and red-build an unrelated
        # PR. Bump these deliberately, regenerating the artifacts in the same
        # commit.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core=2.37-8
          pip install "Pillow==12.3.0"
      - name: Check demo GIF/poster artifacts are up to date
        run: python3 tools/gen_demo_gif.py --check
      - name: Validate static site
        run: python3 .github/scripts/validate_site.py
      - name: Check for design-system drift (#131)
        run: python3 .github/scripts/validate_design_drift.py
      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v
      - name: Test installer source resolution
        run: bash tests/test_resolve_src.sh
      - name: Check install.sh is executable (#100)
        run: |
          mode=$(git ls-files -s install.sh | awk '{print $1}')
          if [ "$mode" != "100755" ]; then
            echo "install.sh mode is $mode, expected 100755"
            echo "Fix: git update-index --chmod=+x install.sh && git commit"
            exit 1
          fi

  exporter-floor:
    name: Exporter on minimum environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Build and check every target payload
        run: |
          for target in claude-code opencode gemini codex cursor github-copilot windsurf zed; do
            cargo run -- check --target "$target"
            cargo run -- build --target "$target" --out "$RUNNER_TEMP/floor"
          done
      - name: Install end to end
        run: |
          cargo run -- install --harness claude-code --dir "$RUNNER_TEMP/install"
          test -f "$RUNNER_TEMP/install/.claude/skills/ship-issue/SKILL.md"
          test -f "$RUNNER_TEMP/install/.claude/agents/sdet.md"
      - name: Install the opencode harness end to end
        run: |
          cargo run -- install --harness opencode --dir "$RUNNER_TEMP/install-opencode"
          test -f "$RUNNER_TEMP/install-opencode/.opencode/commands/ship-issue.md"
          test -f "$RUNNER_TEMP/install-opencode/.opencode/agents/sdet.md"
      - name: Install a skill-only harness end to end
        run: |
          cargo run -- install --harness codex --dir "$RUNNER_TEMP/install-codex"
          test -f "$RUNNER_TEMP/install-codex/.codex/skills/ship-issue/SKILL.md"
          test ! -d "$RUNNER_TEMP/install-codex/.codex/agents"

  deploy:
    name: Deploy to GitHub Pages
    needs: [validate, exporter-floor]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
