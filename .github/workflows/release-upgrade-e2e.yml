name: Release upgrade e2e

on:
  # TEMPORARY PROBE TRIGGER — exists only on this disposable branch to prove the
  # Linux lifecycle runs green before the real workflow lands on the default
  # branch. This branch is never merged; the real workflow has no PR trigger.
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-upgrade-e2e-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Upgrade from previous published Linux release
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Build branch binary
        run: cargo build --release --locked --bin shipmates
      - name: Run previous-release upgrade lifecycle
        env:
          BRANCH_BINARY: ${{ github.workspace }}/target/release/shipmates
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          REPORT_FILE: ${{ runner.temp }}/release-upgrade-e2e-report.md
        run: bash .github/scripts/release-upgrade-e2e.sh --run
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-upgrade-e2e-report
          path: ${{ runner.temp }}/release-upgrade-e2e-report.md
          if-no-files-found: ignore

  file-issue:
    name: File deduplicated failure issue
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download failure report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: release-upgrade-e2e-report
          path: ${{ runner.temp }}/release-upgrade-e2e-report
      - name: File deduplicated issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_FILE: ${{ runner.temp }}/release-upgrade-e2e-report/release-upgrade-e2e-report.md
        run: bash .github/scripts/release-upgrade-e2e.sh --report
