name: Install E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-e2e:
    name: Sandbox install + CLI e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release binary
        run: cargo build --release --locked --bin shipmates
      - name: Install bats-core and assertion libraries (pinned)
        env:
          BATS_LIB_PATH: ${{ runner.temp }}/bats-libs
        run: bash .github/scripts/install-bats.sh
      - name: Run sandbox CLI e2e suite
        env:
          SHIPMATES_BIN: ${{ github.workspace }}/target/release/shipmates
        run: bash .github/scripts/run-sandbox-e2e.sh
      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-install-reports
          path: ${{ runner.temp }}/reports
          if-no-files-found: ignore
