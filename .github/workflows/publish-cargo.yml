# Custom publish job run by cargo-dist during the Release workflow.
# Publishes the crate to crates.io. Requires the CARGO_REGISTRY_TOKEN secret.
name: Publish Cargo

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-cargo:
    runs-on: ubuntu-22.04
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
