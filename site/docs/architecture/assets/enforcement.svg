<polygon points="0,620 -5.5,609 5.5,609" class="arrow"/>
<path d="M 92 519 C 146 519 146 767 83 767" class="flow" stroke-width="2.0" stroke-linecap="round"/>
<polygon points="83,767 94,761.5 94,772.5" class="arrow"/>
