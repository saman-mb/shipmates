<rect x="-116.4" y="198" width="104.4" height="22" rx="6" class="mask"/>
<text x="-64.2" y="213.2" text-anchor="middle" font-size="12" class="chip">× 7 adapters</text>
<rect x="-195.6" y="322" width="183.6" height="22" rx="6" class="mask"/>
<text x="-103.8" y="337.2" text-anchor="middle" font-size="12" class="chip">supported features only</text>
</g>
</svg>
