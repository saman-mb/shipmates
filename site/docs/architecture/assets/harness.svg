<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Harness support: all seven supported harnesses expose a blocking pre-tool hook, so the gate runs before each tool call and an out-of-phase call is denied on every one of them." style="max-width:100%;height:auto;display:block;margin-inline:auto" width="330" height="474" viewBox="0 0 330 474">
<style>.panel{fill:var(--surface-2);stroke:var(--border)}.node{fill:var(--surface);stroke:var(--border-strong)}.mask{fill:var(--surface-2)}.label{fill:var(--text)}.chip{fill:var(--accent-strong)}.flow{fill:none;stroke:var(--accent-strong)}.arrow{fill:var(--accent-strong);stroke:none}text{font-family:var(--font-sans)}</style>
<rect x="0.5" y="0.5" width="329" height="473" rx="16" class="panel" stroke-width="1"/>
<g transform="translate(165,28)">
<line x1="0" y1="46" x2="0" y2="124" class="flow" stroke-width="2.0" stroke-linecap="round"/>
<polygon points="0,124 -5.5,113 5.5,113" class="arrow"/>
<line x1="0" y1="170" x2="0" y2="248" class="flow" stroke-width="2.0" stroke-linecap="round"/>
<polygon points="0,248 -5.5,237 5.5,237" class="arrow"/>
<line x1="0" y1="294" x2="0" y2="372" class="flow" stroke-width="2.0" stroke-linecap="round"/>
<polygon points="0,372 -5.5,361 5.5,361" class="arrow"/>
<rect x="-114.5" y="0" width="229" height="46" rx="10" class="node" stroke-width="1.5"/>
<text x="0" y="28.25" text-anchor="middle" font-size="15" class="label">7 supported harnesses</text>
<rect x="-128" y="124" width="256" height="46" rx="10" class="node" stroke-width="1.5"/>
<text x="0" y="152.25" text-anchor="middle" font-size="15" class="label">each has a blocking hook</text>
<rect x="-137" y="248" width="274" height="46" rx="10" class="node" stroke-width="1.5"/>
<text x="0" y="276.25" text-anchor="middle" font-size="15" class="label">gate runs before each tool</text>
<rect x="-128" y="372" width="256" height="46" rx="10" class="node" stroke-width="1.5"/>
<text x="0" y="400.25" text-anchor="middle" font-size="15" class="label">out-of-phase call denied</text>
</g>
</svg>
