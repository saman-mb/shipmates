[package]
name = "shipmates"
version = "0.1.8"
edition = "2024"
description = "A crew of specialist AI agents and command workflows that drive a GitHub issue to a reviewed, CI-green pull request"
homepage = "https://saman-mb.github.io/shipmates/"
repository = "https://github.com/saman-mb/shipmates"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.5", features = ["derive"] }
flate2 = "1.1.9"
hex = "0.4.3"
home = "0.5.12"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
walkdir = "2.5.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
